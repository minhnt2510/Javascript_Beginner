name: Software Change Request (SCR)
description: Change request
title: "SCR: <short title>"
labels: ["change-request"]
body:
  - type: input
    id: requester
    attributes: { label: "Requester" }
    validations: { required: true }
  - type: input
    id: date
    attributes: { label: "Date", placeholder: "YYYY-MM-DD" }
  - type: dropdown
    id: kind
    attributes: { label: "Type", options: ["Bug fix","Feature","Refactor","Docs"] }
  - type: textarea
    id: goals
    attributes: { label: "Goals and expected impact" }
  - type: textarea
    id: details
    attributes: { label: "Change details (SCIs, risks, interfaces)" }
  - type: textarea
    id: estimate
    attributes: { label: "Timeline and resource estimate" }
